# build.conf — folder-form app registration for build.sh::build_folders
#
# EigenOS ring-3 app: imguitest (Dear ImGui default-dark themed test).
# Compiled with g++ (C++), links against vendored libimgui.a +
# imgui_impl_eigen.o + your ring-3 libc/userui/freetype.
#
# From src/user/apps/test/imguitest/ :
#   lib/imgui  = ../../../lib/imgui
#   backends   = ../../../lib/imgui/backends
#   freetype   = ../../../lib/freetype/include
#
# NOTE: build.conf values are read line-by-line by conf_get(); NO backslash
# continuations — each KEY=value must be on ONE physical line.
NAME=imguitest
SRCS=imguitest.cpp
INCS=../../../lib/imgui ../../../lib/imgui/backends
FLAGS=-fno-exceptions -fno-rtti -fno-threadsafe-statics -DIMGUI_DISABLE_DEFAULT_SHELL_FUNCTIONS -include ../../../lib/imgui/imgui_eigen_compat.h
