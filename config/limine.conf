# Limine bootloader configuration for EigenOS
timeout: 3
serial: yes
wallpaper: boot():/wallpapers/wp1.bmp
wallpaper_style: stretched
backdrop: 000814
term_palette: 0d1117;f85149;3fb950;d29922;58a6ff;bc8cff;39d2c0;e6edf3
term_palette_bright: 30363d;ff7b72;56d364;e3b341;79c0ff;d2a8ff;56d4dd;ffffff
term_background: 100d1117
term_foreground: e6edf3
term_margin: 24

