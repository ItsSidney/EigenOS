# build.conf — folder-app descriptor consumed by build.sh::build_folders()
# NAME  : ELF base name (also the Limine module + spawn target)
# SRCS  : space-separated C sources, relative to this folder
# INCS  : extra -I dirs, relative to this folder (optional)
# FLAGS : extra CFLAGS appended to the shared userland flags (optional)
NAME=calculator
SRCS=main.c
